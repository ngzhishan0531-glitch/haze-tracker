<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eaf6ff;
      font-family: system-ui, sans-serif;
    }
    h1 { color: #2d6a4f; margin: 0 0 8px; }
    svg { width: min(320px, 80vw); height: auto; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pink flower">
    <!-- stem -->
    <path d="M100 150 C95 200 105 250 100 295" stroke="#2d6a4f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M100 235 C65 235 50 210 48 190 C80 192 98 210 100 235 Z" fill="#40916c"/>
    <path d="M101 200 C135 200 152 175 154 155 C122 157 103 175 101 200 Z" fill="#52b788"/>
    <!-- petals -->
    <g fill="#ff7eb6" stroke="#e0508f" stroke-width="1.5">
      <ellipse cx="100" cy="68" rx="20" ry="36"/>
      <ellipse cx="100" cy="68" rx="20" ry="36" transform="rotate(45 100 100)"/>
      <ellipse cx="100" cy="68" rx="20" ry="36" transform="rotate(90 100 100)"/>
      <ellipse cx="100" cy="68" rx="20" ry="36" transform="rotate(135 100 100)"/>
      <ellipse cx="100" cy="68" rx="20" ry="36" transform="rotate(180 100 100)"/>
      <ellipse cx="100" cy="68" rx="20" ry="36" transform="rotate(225 100 100)"/>
      <ellipse cx="100" cy="68" rx="20" ry="36" transform="rotate(270 100 100)"/>
      <ellipse cx="100" cy="68" rx="20" ry="36" transform="rotate(315 100 100)"/>
    </g>
    <!-- center -->
    <circle cx="100" cy="100" r="20" fill="#ffd166" stroke="#e9a820" stroke-width="2"/>
    <circle cx="94" cy="95" r="2.5" fill="#e9a820"/>
    <circle cx="105" cy="97" r="2.5" fill="#e9a820"/>
    <circle cx="99" cy="107" r="2.5" fill="#e9a820"/>
  </svg>
</body>
</html>
